// Runtime-only overrides. All pipeline source, configs, plugins, refs and images
// must already exist in the prepared bundle before this file is used.
profiles {
    offline_smoke {
        params {
            igenomes_ignore = true
            validate_params = false
            custom_config_base = null
            custom_config_version = null
            pipelines_testdata_base_path = null
            modules_testdata_base_path = null
            test_data_base = null
        }
        process {
            executor = 'local'
            resourceLimits = [
                cpus: 2,
                memory: '4.GB',
                time: '1.h'
            ]
        }
        // Keep the registry prefix aligned with the staged archive RepoTags.
        // This is a name mapping only; --network none and -offline still
        // prevent runtime registry access.
        podman.registry = 'quay.io'
        podman.runOptions = '--network none --pull=never'
        docker.registry = 'quay.io'
        docker.runOptions = '--network none'
    }
}
